<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qu-bit Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #153c3e 0%, #081719 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Yu Gothic UI", sans-serif;
    color: #e8f0ee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 32px; letter-spacing: .12em; font-weight: 300; margin-bottom: 8px; }
  p.sub { font-size: 14px; opacity: .7; letter-spacing: .08em; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 800px;
  }
  .card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(168, 224, 208, 0.2);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform .2s, border-color .2s, background .2s;
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(168, 224, 208, 0.6);
    background: rgba(255, 255, 255, 0.08);
  }
  .card h2 { font-size: 20px; letter-spacing: .08em; margin-bottom: 10px; color: #a8e0d0; }
  .card p { font-size: 13px; opacity: .8; line-height: 1.6; margin-bottom: 16px; }
  .badge {
    align-self: flex-start;
    font-size: 11px;
    letter-spacing: .06em;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(168, 224, 208, 0.15);
    color: #a8e0d0;
  }
</style>
</head>
<body>
<header>
  <h1>qu-bit Games</h1>
  <p class="sub">Web Game Collection</p>
</header>
<main class="grid">
  <a class="card" href="./games/Rorqual/">
    <div>
      <span class="badge">3D Simulator</span>
      <h2 style="margin-top: 12px;">Rorqual</h2>
      <p>Three.js で描くオホーツクの冷たい海とヒゲクジラのシミュレータ。群れとともに泳ぎ、魚を捕食し、潮を吹き、大ジャンプ。</p>
    </div>
    <span style="font-size: 12px; opacity: .6; margin-top: 10px;">▶ プレイする</span>
  </a>
</main>
</body>
</html>
